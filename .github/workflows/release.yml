name: Release APK

# Builds the debug APK (the one this app has always been distributed as - see README)
# and publishes it as a GitHub Release whenever a version tag is pushed. HomeActivity's
# UpdateChecker polls /releases/latest and offers the in-app update once this exists.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release (e.g. v1.7)"
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "$RELEASE_TAG" \
            --generate-notes \
            --target "${{ github.sha }}"
