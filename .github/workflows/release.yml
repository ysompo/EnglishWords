name: Release APK

# Builds the debug APK (the one this app has always been distributed as - see README)
# and publishes it as a GitHub Release whenever a version tag is pushed. HomeActivity's
# UpdateChecker polls /releases/latest and offers the in-app update once this exists.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "${{ github.ref_name }}" \
            --generate-notes
